# Every merge to main becomes a numbered release with a build for each OS.
#
# The repository is private, so minutes are billed: Linux at 1x, Windows at 2x
# and macOS at 10x. The shape of this file follows from that:
#
#   - Windows is cross-compiled on Linux. Wails' Windows target needs no cgo
#     (WebView2 is reached through syscalls, SQLite is modernc's pure Go), so a
#     Windows runner would buy nothing but a doubled bill.
#   - macOS is the only job that cannot move, so it does as little as possible:
#     no npm, no tests, no binding generation. It receives the built frontend
#     from the Linux job and only links the app.
#   - Tests, vet and the frontend build run once, on Linux.
#   - Every job has a timeout. A hung job otherwise bills for six hours.
name: Release

on:
  # Paused: merges to main do not build or release for now. Uncomment the push
  # trigger to resume; until then a release is cut by hand from the Actions tab
  # (Release -> Run workflow), which still numbers and publishes it as before.
  #
  # push:
  #   branches: [main]
  #   # Files nothing is built from. skills/*.md are NOT listed: they are embedded.
  #   paths-ignore:
  #     - README.md
  #     - CLAUDE.md
  #     - LICENSE
  #     - docs/**
  #     - .idea/**
  #     - .claude/**
  workflow_dispatch:

# One release at a time, so two quick merges cannot both read "latest is v0.1.4"
# and race to create v0.1.5. A merge that lands while another is queued
# replaces it: the later run builds a main that already contains both.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  WAILS_VERSION: v2.13.0

jobs:
  linux:
    name: Test, frontend, Linux and Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # The next version is the latest v* tag with its patch bumped. Read from
      # the remote rather than a full-history clone, which is all a deep fetch
      # would have been for.
      - name: Choose version
        id: version
        run: |
          latest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next=0.1.0
          else
            IFS=. read -r major minor patch <<<"$latest"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installed plainly rather than through a package cache: the first run
      # used awalsh128/cache-apt-pkgs-action, which restored the -dev packages
      # without their pkg-config files and the cgo build could not find GTK.
      # nsis is makensis, which builds the Windows installer (#130).
      - name: Install GTK, WebKit and NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev nsis

      - name: Restore Wails CLI
        id: wails-cache
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp version
        run: .github/scripts/stamp-version.sh "${{ steps.version.outputs.version }}"

      # Done by hand rather than inside `wails build` so the frontend is built
      # once, with `npm ci`, and can be handed to the macOS job as-is. The
      # placeholder lets the bindings pass compile frontend.Dist's go:embed
      # before there is a dist to embed.
      - name: Generate bindings
        run: |
          mkdir -p frontend/dist && touch frontend/dist/.placeholder
          wails generate module
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build Linux
        run: >
          wails build -s -skipbindings -m -trimpath
          -platform linux/amd64 -tags webkit2_41
          -ldflags "-X aimusicmaker/internal/app.appVersion=${{ steps.version.outputs.version }}"
      # An installer rather than a bare exe (#130): Start menu and desktop
      # shortcuts, an uninstaller, and the WebView2 runtime installed if the
      # machine lacks it.
      - name: Build Windows
        run: >
          wails build -s -skipbindings -m -trimpath -nsis
          -platform windows/amd64
          -ldflags "-X aimusicmaker/internal/app.appVersion=${{ steps.version.outputs.version }}"

      - name: Package
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p release
          tar -czf "release/AIMusicMaker-v$v-linux-amd64.tar.gz" -C build/bin aimusicmaker
          # Wails only warns when makensis is missing and carries on, so this
          # copy is what fails the run if the installer was not made.
          cp build/bin/aimusicmaker-amd64-installer.exe "release/AIMusicMaker-v$v-windows-amd64-setup.exe"

      # Intermediate artifacts live a day: storage is billed too, and the
      # release is where the builds are kept.
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-windows
          path: release/
          retention-days: 1

  macos:
    name: macOS
    needs: linux
    # Apple silicon. Builds a universal app, so Intel Macs are covered too.
    runs-on: macos-15
    # Notarization is most of the extra time over a plain build: usually two to
    # five minutes of waiting on Apple, capped at 20 by package-macos.sh.
    timeout-minutes: 30
    # Signing is skipped, with a warning, until the certificate and its password
    # both exist, so a repository without them still releases. Steps cannot
    # test secrets directly, hence this flag.
    env:
      HAS_SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Restore Wails CLI
        id: wails-cache
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp version
        run: .github/scripts/stamp-version.sh "${{ needs.linux.outputs.version }}"

      - name: Build macOS
        run: >
          wails build -s -skipbindings -m -trimpath
          -platform darwin/universal
          -ldflags "-X aimusicmaker/internal/app.appVersion=${{ needs.linux.outputs.version }}"

      # The Developer ID certificate goes into a keychain of its own rather than
      # the runner's login keychain, so nothing prompts for access and the key
      # is gone with the keychain at the end of the job.
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      # A disk image with the app beside an Applications link (#132), the
      # drag-to-install a Mac user expects, and what the in-app updater opens.
      # Signed with the Developer ID and notarized by Apple, so neither a
      # download nor an update is met by a Gatekeeper warning. hdiutil,
      # codesign and notarytool all ship with macOS, so no brew install on the
      # most expensive runner.
      - name: Sign, package and notarize
        env:
          # Only with the certificate imported: naming an identity the keychain
          # does not hold fails codesign rather than skipping it.
          APPLE_DEVELOPER_ID: ${{ env.HAS_SIGNING_CERT == 'true' && secrets.APPLE_DEVELOPER_ID || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          .github/scripts/package-macos.sh build/bin/aimusicmaker.app
          "release/AIMusicMaker-v${{ needs.linux.outputs.version }}-macos-universal.dmg"

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release/
          retention-days: 1

  release:
    name: Publish release
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # The index the in-app updater reads (#132), after RapidRabbit's
      # manifest: which file is each platform's, and the SHA-256 it must match.
      # The updater offers nothing from a release without one, so a missing
      # platform fails the run rather than publish a release no copy can
      # update to.
      - name: Write manifest and checksums
        working-directory: release
        run: |
          pick() { find . -maxdepth 1 -name "$1" -printf '%f\n' | head -n1; }
          win=$(pick '*-windows-amd64-setup.exe')
          mac=$(pick '*-macos-universal.dmg')
          lin=$(pick '*-linux-amd64.tar.gz')
          for f in "$win" "$mac" "$lin"; do
            [ -n "$f" ] || { echo "::error::a platform's file is missing from the release"; exit 1; }
          done
          sha256sum "$win" "$mac" "$lin" > checksums.txt
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          jq -n --arg v "${{ needs.linux.outputs.version }}" --arg c "${{ github.sha }}" \
            --arg win "$win" --arg winsum "$(sum "$win")" \
            --arg mac "$mac" --arg macsum "$(sum "$mac")" \
            --arg lin "$lin" --arg linsum "$(sum "$lin")" \
            '{version: $v, commit: $c, assets: {
               "windows-amd64":    {name: $win, sha256: $winsum},
               "darwin-universal": {name: $mac, sha256: $macsum},
               "linux-amd64":      {name: $lin, sha256: $linsum}}}' > manifest.json
          cat manifest.json

      # gh creates the tag on the merged commit; notes are the PRs since the
      # previous tag.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=v${{ needs.linux.outputs.version }}
          gh release create "$v" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$v" \
            --generate-notes
